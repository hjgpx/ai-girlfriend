<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小暖 - 电子女友</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar">暖</div>
      <div class="info">
        <h1>小暖</h1>
        <p class="status">在线 · 想你了</p>
      </div>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        <div class="bubble">你好呀～我是小暖，终于等到你了。今天过得怎么样？</div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="想对小暖说点什么..." autocomplete="off">
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
